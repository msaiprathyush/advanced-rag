# CI gate floors.
#
# retrieval_*: checked on EVERY PR by `python -m advanced_rag.eval.retrieval_eval --gate`.
#   Deterministic and uses no LLM tokens. Measured: hybrid_rerank recall 1.0, MRR 0.98.
retrieval_recall: 0.90
retrieval_mrr: 0.85

# Checked by the nightly RAGAS run (`ragas_eval --rotate 4`). Groq's free tier allows only 200k
# tokens/day per model, so each run scores a few questions; the run FAILS if a metric was scored on
# too few samples rather than passing on a lucky small sample.
decline_rate_unanswerable: 0.8
false_decline_rate_answerable: 0.25   # a MAXIMUM, not a minimum
faithfulness: 0.70
context_recall: 0.60
