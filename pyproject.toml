[project]
name = "advanced-rag"
version = "0.1.0"
description = "Production-grade RAG research assistant over recent arXiv ML/AI papers: hybrid retrieval, re-ranking, self-correcting LangGraph loop, RAGAS eval, scheduled re-indexing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.2",
    "langchain-groq>=1.1",
    "langgraph>=1.1",
    "langchain-text-splitters>=1.1",
    "qdrant-client>=1.15",
    "fastembed>=0.8",
    "pymupdf4llm>=1.27",
    "httpx>=0.28",
    "feedparser>=6.0",
    "tenacity>=9.0",
    "pydantic-settings>=2.10",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "structlog>=25.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.13",
    "mypy>=1.18",
    "ipykernel>=6.30",
]
eval = [
    "ragas>=0.4",
    "pandas>=2.3",
    "langchain-community>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_rag"]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live: hits real network services (arXiv, Groq, Qdrant Cloud); excluded by default",
]
addopts = "-m 'not live'"
